
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khôi phục mật khẩu | LingoMate AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 75px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
      border-radius: 22px;
      background: #eff6ff;
      font-size: 35px;
    }

    h1 {
      text-align: center;
      color: #1e293b;
      font-size: 25px;
      margin-bottom: 12px;
    }

    .description {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #334155;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      margin-bottom: 20px;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      color: #16a34a;
    }

    .error {
      color: #dc2626;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">🔐</div>

    <h1>Đặt lại mật khẩu</h1>

    <p class="description">
      Nhập mật khẩu mới để tiếp tục sử dụng tài khoản LingoMate AI.
    </p>

    <form id="resetForm">
      <label for="password">Mật khẩu mới</label>
      <input
        type="password"
        id="password"
        placeholder="Nhập mật khẩu mới"
        minlength="8"
        maxlength="72"
        required
      >

      <label for="confirmPassword">Xác nhận mật khẩu</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Nhập lại mật khẩu mới"
        minlength="8"
        maxlength="72"
        required
      >

      <button type="submit" id="submitButton">
        Xác nhận đổi mật khẩu
      </button>
    </form>

    <p id="message"></p>

    <a class="back" href="/">Quay lại</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submitButton');

    if (!token) {
      form.style.display = 'none';
      message.textContent = 'Liên kết khôi phục không hợp lệ hoặc thiếu mã xác nhận.';
      message.className = 'error';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const newPassword = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      message.textContent = '';
      message.className = '';

      if (newPassword.length < 8 || newPassword.length > 72) {
        message.textContent = 'Mật khẩu phải có từ 8 đến 72 ký tự.';
        message.className = 'error';
        return;
      }

      if (newPassword !== confirmPassword) {
        message.textContent = 'Mật khẩu xác nhận không khớp.';
        message.className = 'error';
        return;
      }

      button.disabled = true;
      button.textContent = 'Đang xử lý...';

      try {
        const response = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            token: token,
            newPassword: newPassword
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            Array.isArray(data.message)
              ? data.message.join(', ')
              : data.message || 'Không thể đặt lại mật khẩu.'
          );
        }

        form.style.display = 'none';
        message.textContent =
          'Đặt lại mật khẩu thành công! Bạn có thể quay lại ứng dụng và đăng nhập.';
        message.className = 'success';

      } catch (error) {
        message.textContent = error.message;
        message.className = 'error';
      } finally {
        button.disabled = false;
        button.textContent = 'Xác nhận đổi mật khẩu';
      }
    });
  </script>
</body>
</html>
